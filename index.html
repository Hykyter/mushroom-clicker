<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mushroom Coin Online</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: radial-gradient(circle, #2c1e14 0%, #000000 100%); color: white; text-align: center; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { margin-top: 20px; padding: 10px; }
        #score { font-size: 45px; font-weight: bold; color: #ffeb3b; text-shadow: 0 0 20px rgba(255,235,59,0.4); }
        #mcoin-display { font-size: 18px; color: #00e676; font-weight: bold; }
        .content { flex-grow: 1; overflow-y: auto; padding-bottom: 100px; }
        .page { display: none; padding: 20px; box-sizing: border-box; }
        .active-page { display: block !important; }
        #mushroom { width: 200px; cursor: pointer; transition: transform 0.08s; margin-top: 30px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.1)); }
        #mushroom:active { transform: scale(0.92); }
        .shop-item { background: rgba(255,255,255,0.05); padding: 15px; margin: 10px 0; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        .buy-btn { background: #ffeb3b; color: black; padding: 10px 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }
        .nav { display: flex; background: rgba(0,0,0,0.9); padding: 15px 5px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { flex: 1; font-size: 10px; opacity: 0.4; cursor: pointer; text-transform: uppercase; }
        .nav-item.active { opacity: 1; color: #ffeb3b; font-weight: bold; }
        #multiplier { font-size: 50px; color: #ffeb3b; margin: 20px 0; }
    </style>
</head>
<body>

<div class="header">
    <div id="score">0</div>
    <div id="mcoin-display">🪙 0 MC</div>
</div>

<div class="content">
    <div id="game" class="page active-page">
        <img id="mushroom" src="1000002276.png" onclick="clickMushroom()" onerror="this.src='https://img.icons8.com/emoji/256/mushroom-emoji.png'">
        <p style="color: #666; margin-top: 20px;">Тапай мухомор!</p>
    </div>

    <div id="shop" class="page">
        <h2 style="color: #ffeb3b;">Магазин</h2>
        <div class="shop-item"><div><b>Клик +2</b></div><button id="upgrade-btn" class="buy-btn" onclick="buyUpgrade()">50</button></div>
        <div class="shop-item"><div><b>Ферма (+50/ч)</b></div><button id="farm-btn" class="buy-btn" onclick="buyFarm()">1000</button></div>
        <div class="shop-item"><div><b>Склад +2ч</b></div><button id="limit-btn" class="buy-btn" onclick="buyLimit()">2500</button></div>
        <button class="buy-btn" style="width:100%; background:#00e676; color:white; margin-top:20px;" onclick="exchangeMushrooms()">ОБМЕН (500к на 1 MC)</button>
    </div>

    <div id="games" class="page">
        <h2 style="color: #ffeb3b;">🚀 Ракетка</h2>
        <div style="background:#111; padding:20px; border-radius:20px; border:1px solid #ffeb3b;">
            <div id="multiplier">1.00x</div>
            <input type="number" id="bet-amount" value="1" style="width:60px; background:#222; color:white; border:1px solid #ffeb3b; padding:8px; border-radius:10px; text-align: center;"> MC
            <button id="rocket-btn" class="buy-btn" style="width:100%; margin-top:15px; height: 50px;" onclick="handleRocket()">СТАРТ</button>
        </div>
    </div>

    <div id="leaders" class="page">
        <h2 style="color: #ffeb3b;">🏆 ТОП-30 МИРА</h2>
        <div id="leader-list">Загрузка рейтинга...</div>
    </div>
</div>

<div class="nav">
    <div id="nav-game" class="nav-item active" onclick="showPage('game')">ДОМ</div>
    <div id="nav-shop" class="nav-item" onclick="showPage('shop')">ШОП</div>
    <div id="nav-games" class="nav-item" onclick="showPage('games')">ИГРЫ</div>
    <div id="nav-leaders" class="nav-item" onclick="showPage('leaders')">ТОП</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDXEYGzr0W0sQijK6CkFkwcTDx93LiVEkk",
        authDomain: "mushroomclicker.firebaseapp.com",
        projectId: "mushroomclicker",
        storageBucket: "mushroomclicker.firebasestorage.app",
        messagingSenderId: "828741182647",
        appId: "1:828741182647:web:552f32674178a57e58d932",
        databaseURL: "https://mushroomclicker-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let tg = window.Telegram.WebApp;
    tg.expand();

    const uId = tg.initDataUnsafe?.user?.id || "local_user";
    const uName = tg.initDataUnsafe?.user?.first_name || "Грибник";

    let count = parseFloat(localStorage.getItem('m_cnt')) || 0;
    let mCoins = parseInt(localStorage.getItem('m_mc')) || 0;
    let power = parseInt(localStorage.getItem('m_pwr')) || 1;
    let upgCost = parseInt(localStorage.getItem('m_cst')) || 50;
    let farmRate = parseFloat(localStorage.getItem('m_fr')) || 0;
    let farmCost = parseInt(localStorage.getItem('m_fc')) || 1000;
    let farmLimit = parseInt(localStorage.getItem('m_fl')) || 2;

    window.updateUI = function() {
        document.getElementById('score').innerText = Math.floor(count).toLocaleString();
        document.getElementById('mcoin-display').innerText = '🪙 ' + mCoins + ' MC';
        document.getElementById('upgrade-btn').innerText = upgCost;
        document.getElementById('farm-btn').innerText = farmCost;
        document.getElementById('limit-btn').innerText = farmLimit + 'ч';
    }

    function save() {
        localStorage.setItem('m_cnt', count);
        localStorage.setItem('m_mc', mCoins);
        localStorage.setItem('m_pwr', power);
        localStorage.setItem('m_cst', upgCost);
        localStorage.setItem('m_fr', farmRate);
        localStorage.setItem('m_fc', farmCost);
        localStorage.setItem('m_fl', farmLimit);
        localStorage.setItem('m_lv', Date.now());
        
        set(ref(db, 'users/' + uId), { n: uName, s: Math.floor(count), c: mCoins });
    }

    window.clickMushroom = function() {
        count += power; updateUI(); save();
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    window.buyUpgrade = function() { if(count >= upgCost) { count -= upgCost; power += 2; upgCost = Math.floor(upgCost * 1.6); updateUI(); save(); } }
    window.buyFarm = function() { if(count >= farmCost) { count -= farmCost; farmRate += 0.014; farmCost *= 2; updateUI(); save(); } }
    window.buyLimit = function() { if(count >= 2500) { count -= 2500; farmLimit += 2; updateUI(); save(); } }
    window.exchangeMushrooms = function() { if(count >= 500000) { count -= 500000; mCoins += 1; updateUI(); save(); } }

    window.showPage = function(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
        document.getElementById(p).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('nav-'+p).classList.add('active');
        if(p === 'leaders') loadLeaders();
    }

    function loadLeaders() {
        onValue(ref(db, 'users/'), (snap) => {
            const data = snap.val();
            let arr = [];
            for(let id in data) arr.push(data[id]);
            arr.sort((a,b) => b.s - a.s);
            let h = "";
            arr.slice(0, 30).forEach((p, i) => {
                h += `<div class="shop-item"><span>${i+1}. ${p.n}</span><span>${p.s.toLocaleString()} 🍄</span></div>`;
            });
            document.getElementById('leader-list').innerHTML = h || "Пока никого нет...";
        });
    }

    let rRun = false, rM = 1.0, rI;
    window.handleRocket = function() {
        let b = parseInt(document.getElementById('bet-amount').value);
        if(rRun) { stopR(false); return; }
        if(mCoins < b || b <= 0) { tg.showAlert("Мало MC!"); return; }
        mCoins -= b; rRun = true; rM = 1.0;
        document.getElementById('rocket-btn').innerText = "ЗАБРАТЬ!";
        document.getElementById('rocket-btn').style.background = "#ff5252";
        rI = setInterval(() => {
            rM += 0.08; document.getElementById('multiplier').innerText = rM.toFixed(2)+"x";
            if(Math.random() < (rM * 0.015)) stopR(true);
        }, 100);
    }
    function stopR(c) {
        clearInterval(rI); rRun = false;
        let b = parseInt(document.getElementById('bet-amount').value);
        if(!c) { mCoins += Math.floor(b * rM); tg.HapticFeedback.notificationOccurred('success'); }
        else { tg.HapticFeedback.notificationOccurred('error'); document.getElementById('multiplier').innerText = "БАБАХ!"; }
        document.getElementById('rocket-btn').innerText = "СТАРТ";
        document.getElementById('rocket-btn').style.background = "#ffeb3b";
        updateUI(); save();
    }

    updateUI();
</script>
</body>
</html>
