<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mushroom Evolution FIX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #ffeb3b; --green: #00e676; --red: #ff5252; }
        body { background: #000; color: white; text-align: center; font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        
        .header { background: rgba(255,255,255,0.05); margin: 15px; padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        #score { font-size: 50px; font-weight: 900; color: var(--gold); margin: 0; }
        #mc-display { color: var(--green); font-weight: bold; font-size: 18px; }

        .content { height: calc(100vh - 200px); overflow-y: auto; position: relative; }
        .page { display: none; padding: 20px; padding-bottom: 100px; }
        .active-page { display: block !important; }

        /* Тапалка */
        #mushroom { width: 220px; margin-top: 30px; transition: transform 0.05s; z-index: 10; position: relative; }
        #mushroom:active { transform: scale(0.9); }
        .click-ani { position: absolute; color: var(--gold); font-weight: bold; animation: floatUp 0.6s forwards; pointer-events: none; z-index: 1000; }
        @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-100px); } }

        /* Кнопки и карточки */
        .card { background: rgba(255,255,255,0.07); padding: 20px; border-radius: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        .btn { background: var(--gold); color: black; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; z-index: 20; position: relative; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Ракета */
        .rocket-box { background: #111; border: 2px solid #333; border-radius: 30px; padding: 25px; position: relative; transition: 0.3s; }
        .rocket-active { border-color: var(--gold); box-shadow: 0 0 30px rgba(255,235,59,0.2); animation: shake 0.1s infinite; }
        #multiplier { font-size: 60px; font-weight: bold; color: var(--gold); margin: 20px 0; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        /* Навигация */
        .nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { flex: 1; opacity: 0.5; font-size: 10px; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--gold); }
    </style>
</head>
<body>

<div class="header">
    <div id="score">0</div>
    <div id="mc-display">🪙 <span id="mc-val">0</span> MC</div>
</div>

<div class="content">
    <div id="game" class="page active-page">
        <img id="mushroom" src="1000002276.png" onclick="handleTap(event)" onerror="this.src='https://img.icons8.com/emoji/256/mushroom-emoji.png'">
        <p style="color: #444; margin-top: 30px;">LEVEL: <span id="lvl">1</span></p>
    </div>

    <div id="shop" class="page">
        <h2 style="color: var(--gold)">МАГАЗИН</h2>
        <div class="card">
            <div style="text-align:left"><b>Сила клика</b><br><small>+2 к тапу</small></div>
            <button class="btn" onclick="buyUpgrade()">КУПИТЬ: <span id="u-cost">50</span></button>
        </div>
        <div class="card">
            <div style="text-align:left"><b>Ферма</b><br><small>Автодоход</small></div>
            <button class="btn" onclick="buyFarm()">КУПИТЬ: <span id="f-cost">1000</span></button>
        </div>
        <button class="btn" style="width:100%; background: var(--green); color:white" onclick="exchange()">ОБМЕН (500к на 1 MC)</button>
    </div>

    <div id="games" class="page">
        <div class="rocket-box" id="r-box">
            <h3>CRASH ROCKET</h3>
            <div id="multiplier">1.00x</div>
            <input type="number" id="bet" value="1" style="width:60px; padding:10px; border-radius:10px; background:#222; color:white; border:1px solid var(--gold); text-align:center">
            <button id="r-btn" class="btn" style="width:100%; margin-top:20px; height:50px" onclick="rocketAction()">СТАРТ</button>
        </div>
    </div>

    <div id="leaders" class="page">
        <h2 style="color: var(--gold)">ТОП ИГРОКОВ</h2>
        <div id="leader-list"></div>
        <button class="btn" style="margin-top:30px; background:#444; color:white; font-size:10px" onclick="recoverMushrooms()">Грибы не вернулись? Жми!</button>
    </div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="showPage('game', this)">🍄<br>ДОМ</div>
    <div class="nav-item" onclick="showPage('shop', this)">🛒<br>ШОП</div>
    <div class="nav-item" onclick="showPage('games', this)">🚀<br>ИГРЫ</div>
    <div class="nav-item" onclick="showPage('leaders', this)">🏆<br>ТОП</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDXEYGzr0W0sQijK6CkFkwcTDx93LiVEkk",
        authDomain: "mushroomclicker.firebaseapp.com",
        projectId: "mushroomclicker",
        storageBucket: "mushroomclicker.firebasestorage.app",
        messagingSenderId: "828741182647",
        appId: "1:828741182647:web:552f32674178a57e58d932",
        databaseURL: "https://mushroomclicker-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tg = window.Telegram.WebApp;
    tg.expand();

    const uId = tg.initDataUnsafe?.user?.id || "local_user";
    const uName = tg.initDataUnsafe?.user?.first_name || "Gribnik";

    // Данные
    let count = 0, mCoins = 0, power = 1, uCost = 50, fCost = 1000;

    async function load() {
        const snap = await get(ref(db, 'users/' + uId));
        if (snap.exists()) {
            const d = snap.val();
            count = d.s || 0; mCoins = d.c || 0; power = d.p || 1;
            uCost = d.uc || 50; fCost = d.fc || 1000;
        } else {
            recoverMushrooms(); // Если в базе нет, ищем в телефоне
        }
        updateUI();
    }

    window.recoverMushrooms = function() {
        count = parseFloat(localStorage.getItem('m_cnt')) || count;
        mCoins = parseInt(localStorage.getItem('m_mc')) || mCoins;
        power = parseInt(localStorage.getItem('m_pwr')) || power;
        tg.showAlert("Попытка восстановления завершена!");
        updateUI(); save();
    }

    window.updateUI = function() {
        document.getElementById('score').innerText = Math.floor(count).toLocaleString();
        document.getElementById('mc-val').innerText = mCoins;
        document.getElementById('u-cost').innerText = uCost;
        document.getElementById('f-cost').innerText = fCost;
        document.getElementById('lvl').innerText = Math.floor(count / 10000) + 1;
    }

    function save() {
        localStorage.setItem('m_cnt', count);
        localStorage.setItem('m_mc', mCoins);
        localStorage.setItem('m_pwr', power);
        set(ref(db, 'users/' + uId), { n: uName, s: Math.floor(count), c: mCoins, p: power, uc: uCost, fc: fCost });
    }

    window.handleTap = function(e) {
        count += power;
        const ani = document.createElement('div');
        ani.className = 'click-ani';
        ani.innerText = `+${power}`;
        ani.style.left = e.pageX + 'px';
        ani.style.top = e.pageY + 'px';
        document.body.appendChild(ani);
        setTimeout(() => ani.remove(), 600);
        updateUI(); save();
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    window.buyUpgrade = function() {
        if(count >= uCost) { count -= uCost; power += 2; uCost = Math.floor(uCost * 1.7); updateUI(); save(); }
        else { tg.showAlert("Мало грибов!"); }
    }

    window.buyFarm = function() {
        if(count >= fCost) { count -= fCost; tg.showAlert("Ферма куплена! (Автодоход скоро)"); fCost *= 2; updateUI(); save(); }
    }

    window.exchange = function() {
        if(count >= 500000) { count -= 500000; mCoins += 1; updateUI(); save(); }
    }

    window.showPage = function(p, el) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
        document.getElementById(p).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(p === 'leaders') loadLeaders();
    }

    // РАКЕТА
    let rRunning = false, rMult = 1.0, rInt;
    window.rocketAction = function() {
        const bet = parseInt(document.getElementById('bet').value);
        const btn = document.getElementById('r-btn');
        const box = document.getElementById('r-box');
        if(rRunning) { stopRocket(false); return; }
        if(mCoins < bet || bet <= 0) { tg.showAlert("Мало MC!"); return; }
        
        mCoins -= bet; rRunning = true; rMult = 1.0; updateUI();
        btn.innerText = "ЗАБРАТЬ!"; btn.style.background = "#ff5252";
        box.classList.add('rocket-active');
        
        rInt = setInterval(() => {
            rMult += 0.08;
            document.getElementById('multiplier').innerText = rMult.toFixed(2) + "x";
            if(Math.random() < (rMult * 0.018)) stopRocket(true);
        }, 100);
    }

    function stopRocket(crash) {
        clearInterval(rInt); rRunning = false;
        const box = document.getElementById('r-box');
        const btn = document.getElementById('r-btn');
        const bet = parseInt(document.getElementById('bet').value);
        box.classList.remove('rocket-active');
        if(crash) {
            document.getElementById('multiplier').innerText = "💥";
            tg.HapticFeedback.notificationOccurred('error');
        } else {
            mCoins += Math.floor(bet * rMult);
            tg.HapticFeedback.notificationOccurred('success');
        }
        btn.innerText = "СТАРТ"; btn.style.background = "var(--gold)";
        save(); updateUI();
    }

    function loadLeaders() {
        onValue(ref(db, 'users/'), (s) => {
            let a = []; s.forEach(x => { a.push(x.val()) });
            a.sort((x,y) => y.s - x.s);
            document.getElementById('leader-list').innerHTML = a.slice(0,15).map((u,i) => 
                `<div class="card"><span>${i+1}. ${u.n}</span><span>${u.s.toLocaleString()} 🍄</span></div>`
            ).join('');
        });
    }

    load();
</script>
</body>
</html>
