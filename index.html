<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mushroom Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; overflow: hidden; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #score { font-size: 50px; margin-bottom: 20px; font-weight: bold; color: #ffeb3b; }
        .mushroom-container { cursor: pointer; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .mushroom-container:active { transform: scale(0.9); }
        #mushroom { font-size: 180px; user-select: none; }
    </style>
</head>
<body>
    <div id="score">0</div>
    <div class="mushroom-container" onclick="clickMushroom()">
        <div id="mushroom">🍄</div>
    </div>

    <script>
        let count = 0;
        const scoreElement = document.getElementById('score');
        
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Разворачивает приложение на весь экран

        function clickMushroom() {
            count++;
            scoreElement.innerText = count;
            
            // Вибрация при клике
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }
    </script>
</body>
      </html>
