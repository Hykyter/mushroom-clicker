<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mushroom Coin Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: radial-gradient(circle, #2c1e14 0%, #000000 100%); color: white; text-align: center; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { margin-top: 20px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        #score { font-size: 50px; font-weight: bold; color: #ffeb3b; text-shadow: 0 0 20px rgba(255,235,59,0.4); margin: 0; }
        #mcoin-display { font-size: 18px; color: #00e676; margin-top: 5px; font-weight: bold; }
        .content { flex-grow: 1; position: relative; overflow: hidden; }
        .page { display: none; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .active-page { display: block !important; }
        
        .mushroom-container { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #mushroom { width: 220px; cursor: pointer; transition: transform 0.08s; -webkit-tap-highlight-color: transparent; filter: drop-shadow(0 0 15px rgba(255,255,255,0.1)); }
        #mushroom:active { transform: scale(0.92); }

        .shop-item, .leader-item { background: rgba(255,255,255,0.05); padding: 15px; margin: 10px 0; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        .buy-btn { background: #ffeb3b; color: black; padding: 10px 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; min-width: 80px; }
        .exchange-btn { background: #00e676; color: white; width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; margin-top: 10px; }

        .nav { display: flex; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 15px 5px; border-top: 1px solid rgba(255,255,255,0.1); position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .nav-item { flex: 1; font-size: 10px; opacity: 0.4; text-transform: uppercase; transition: 0.2s; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { opacity: 1; color: #ffeb3b; font-weight: bold; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div id="score">0</div>
    <div id="mcoin-display">🪙 0 MC</div>
    <div id="power-info" style="font-size: 12px; color: #888; margin-top: 5px;">Клик: +1 | Фарм: 0/час</div>
</div>

<div class="content">
    <div id="game" class="page active-page">
        <div class="mushroom-container">
            <img id="mushroom" src="1000002276.png" onclick="clickMushroom()" onerror="this.src='https://img.icons8.com/emoji/256/mushroom-emoji.png'">
            <p style="color: #666; margin-top: 20px;">Кликай и богатей!</p>
        </div>
    </div>

    <div id="shop" class="page">
        <h2 style="color: #ffeb3b;">Магазин</h2>
        <div class="shop-item">
            <div style="text-align: left;">
                <b>Мухоморная мощь</b><br>
                <small style="color: #aaa;">Клик +2</small>
            </div>
            <button id="upgrade-btn" class="buy-btn" onclick="buyUpgrade()">50 🍄</button>
        </div>
        <div class="shop-item">
            <div style="text-align: left;">
                <b>🍄 Грибная ферма</b><br>
                <small style="color: #aaa;">Пассив: +50/час</small>
            </div>
            <button id="farm-btn" class="buy-btn" onclick="buyFarm()">1000 🍄</button>
        </div>
        <div class="shop-item">
            <div style="text-align: left;">
                <b>📦 Грибной склад</b><br>
                <small id="limit-info" style="color: #aaa;">Лимит: 2 часа</small>
            </div>
            <button id="limit-btn" class="buy-btn" onclick="buyLimit()">2500 🍄</button>
        </div>

        <h2 style="color: #00e676; margin-top: 30px;">Обменник</h2>
        <div style="background: rgba(0,230,118,0.1); padding: 15px; border-radius: 15px; border: 1px dashed #00e676;">
            <p style="margin: 0;">500,000 🍄 = 1 🪙 MC</p>
            <button class="exchange-btn" onclick="exchangeMushrooms()">ОБМЕНЯТЬ</button>
        </div>
    </div>

    <div id="leaders" class="page">
        <h2 style="color: #ffeb3b;">Топ-30 Грибников</h2>
        <div id="leader-list">
            <div class="leader-item"><span>1. HABE***_AYT***</span><span>1.5M 🍄</span></div>
        </div>
    </div>

    <div id="games" class="page">
        <h2 style="color: #ffeb3b;">Грибные Игры</h2>
        <div style="background: linear-gradient(45deg, #ff5252, #ffeb3b); padding: 25px; border-radius: 20px; color: black;">
            <h3>🚀 РАКЕТКА</h3>
            <p>Ставь MC и множь их!</p>
            <button class="buy-btn" style="width: 100%; border: 2px solid black;" onclick="tg.showAlert('Ракета готовится к запуску!')">ИГРАТЬ</button>
        </div>
    </div>
</div>

<div class="nav">
    <div id="nav-game" class="nav-item active" onclick="showPage('game')"><span class="nav-icon">🍄</span>Дом</div>
    <div id="nav-shop" class="nav-item" onclick="showPage('shop')"><span class="nav-icon">🛒</span>Магазин</div>
    <div id="nav-leaders" class="nav-item" onclick="showPage('leaders')"><span class="nav-icon">🏆</span>Топ</div>
    <div id="nav-games" class="nav-item" onclick="showPage('games')"><span class="nav-icon">🚀</span>Игры</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    // Загрузка данных
    let count = parseFloat(localStorage.getItem('mush_count')) || 0;
    let mCoins = parseInt(localStorage.getItem('mush_coins')) || 0;
    let power = parseInt(localStorage.getItem('mush_power')) || 1;
    let upgradeCost = parseInt(localStorage.getItem('mush_cost')) || 50;
    
    // Новые данные для фарма
    let farmRate = parseFloat(localStorage.getItem('mush_farm_rate')) || 0; // грибов в СЕКУНДУ
    let farmCost = parseInt(localStorage.getItem('mush_farm_cost')) || 1000;
    let farmLimitHours = parseInt(localStorage.getItem('mush_limit_hours')) || 2; // лимит в часах
    let limitCost = parseInt(localStorage.getItem('mush_limit_cost')) || 2500;
    let lastVisit = parseInt(localStorage.getItem('mush_last_visit')) || Date.now();

    function updateUI() {
        document.getElementById('score').innerText = Math.floor(count).toLocaleString();
        document.getElementById('mcoin-display').innerText = '🪙 ' + mCoins + ' MC';
        document.getElementById('power-info').innerText = `Клик: +${power} | Фарм: ${Math.floor(farmRate * 3600)}/час`;
        document.getElementById('upgrade-btn').innerText = upgradeCost + ' 🍄';
        document.getElementById('farm-btn').innerText = farmCost + ' 🍄';
        document.getElementById('limit-btn').innerText = limitCost + ' 🍄';
        document.getElementById('limit-info').innerText = `Лимит: ${farmLimitHours} часа(ов)`;
    }

    function checkOfflineFarm() {
        let now = Date.now();
        let diffSeconds = Math.floor((now - lastVisit) / 1000);
        let maxSeconds = farmLimitHours * 3600;

        if (diffSeconds > 60 && farmRate > 0) {
            let actualSeconds = Math.min(diffSeconds, maxSeconds);
            let earned = actualSeconds * farmRate;
            
            if (earned > 0) {
                count += earned;
                let message = `Пока тебя не было, ферма принесла ${Math.floor(earned)} 🍄`;
                if (diffSeconds > maxSeconds) message += ` (достигнут лимит склада!)`;
                tg.showPopup({ title: 'Оффлайн доход', message: message, buttons: [{type: 'ok'}] });
            }
        }
        localStorage.setItem('mush_last_visit', now);
    }

    function clickMushroom() {
        count += power;
        updateUI();
        saveData();
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    function buyUpgrade() {
        if (count >= upgradeCost) {
            count -= upgradeCost;
            power += 2;
            upgradeCost = Math.floor(upgradeCost * 1.6);
            updateUI(); saveData();
            tg.HapticFeedback.notificationOccurred('success');
        } else { tg.showAlert('Мало грибов!'); }
    }

    function buyFarm() {
        if (count >= farmCost) {
            count -= farmCost;
            farmRate += 0.0138; // Примерно +50 в час (50/3600)
            farmCost = Math.floor(farmCost * 1.8);
            updateUI(); saveData();
            tg.HapticFeedback.notificationOccurred('success');
        } else { tg.showAlert('Мало грибов на ферму!'); }
    }

    function buyLimit() {
        if (count >= limitCost) {
            count -= limitCost;
            farmLimitHours += 2;
            limitCost = Math.floor(limitCost * 2.2);
            updateUI(); saveData();
            tg.HapticFeedback.notificationOccurred('success');
        } else { tg.showAlert('Мало грибов на склад!'); }
    }

    function exchangeMushrooms() {
        if (count >= 500000) {
            count -= 500000;
            mCoins += 1;
            updateUI(); saveData();
            tg.showAlert('Обмен завершен! +1 MC');
        } else { tg.showAlert('Нужно 500,000 🍄'); }
    }

    function saveData() {
        localStorage.setItem('mush_count', count);
        localStorage.setItem('mush_coins', mCoins);
        localStorage.setItem('mush_power', power);
        localStorage.setItem('mush_cost', upgradeCost);
        localStorage.setItem('mush_farm_rate', farmRate);
        localStorage.setItem('mush_farm_cost', farmCost);
        localStorage.setItem('mush_limit_hours', farmLimitHours);
        localStorage.setItem('mush_limit_cost', limitCost);
        localStorage.setItem('mush_last_visit', Date.now());
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById('nav-' + pageId).classList.add('active');
    }

    checkOfflineFarm();
    updateUI();
    setInterval(() => localStorage.setItem('mush_last_visit', Date.now()), 10000);
</script>
</body>
</html>
