<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mushroom Farm Pro Max</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #ffeb3b; --green: #00e676; --red: #ff5252; --blue: #2196f3; --glass: rgba(255, 255, 255, 0.07); }
        body { background: #000; color: white; text-align: center; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { margin: 10px; padding: 15px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        #score { font-size: 32px; font-weight: 900; color: var(--gold); }
        #mc-info { font-size: 18px; color: var(--green); font-weight: bold; }
        .content { flex-grow: 1; overflow-y: auto; padding-bottom: 100px; }
        .page { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .active-page { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: rgba(255,255,255,0.05); padding: 15px; margin-bottom: 10px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .btn { background: var(--blue); color: white; padding: 12px 20px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .rocket-container { background: #050505; border-radius: 25px; height: 300px; position: relative; overflow: hidden; border: 1px solid #222; margin-top: 10px; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: starMove linear infinite; }
        @keyframes starMove { from { transform: translateY(-10px); } to { transform: translateY(310px); } }
        #rocket-obj { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 60px; z-index: 10; display: none; }
        #multiplier-txt { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-weight: bold; color: white; z-index: 20; }
        .nav { display: flex; position: fixed; bottom: 0; width: 100%; background: #0a0a0a; padding: 15px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; opacity: 0.4; font-size: 10px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .nav-item.active { opacity: 1; color: var(--blue); }
        #mushroom { width: 180px; margin-top: 30px; cursor: pointer; transition: 0.1s; filter: drop-shadow(0 0 15px rgba(255,255,255,0.1)); }
        #mushroom:active { transform: scale(0.9); }
        input { background: #111; color: white; border: 1px solid #333; padding: 12px; border-radius: 10px; outline: none; }
    </style>
</head>
<body>

<div class="header">
    <div id="score">0</div>
    <div id="mc-info">🪙 <span id="mc-val">0</span> MC</div>
    <div id="inc-display" style="font-size: 12px; color: var(--green); margin-top: 5px;"></div>
</div>

<div class="content">
    <div id="game" class="page active-page">
        <img id="mushroom" src="1000002276.png" onclick="tap()">
        <p style="color: #666; margin-top: 20px;">СИЛА КЛИКА: +<span id="pwr-val">1</span></p>
    </div>

    <div id="shop" class="page">
        <div class="card" style="border-color: var(--gold)">
            <div><b>Купить 1 MC</b><br><small>Цена: 500,000 🍄</small></div>
            <button class="btn" onclick="buyMC()" style="background:var(--gold); color:black">КУПИТЬ</button>
        </div>
        <div class="card" style="border-color: var(--red)">
            <div><b>Продать 1 MC</b><br><small>Выхлоп: 350,000 🍄</small></div>
            <button class="btn" onclick="sellMC()" style="background:var(--red)">ПРОДАТЬ</button>
        </div>
        <div class="card">
            <div><b>Апгрейд клика</b><br><small>Цена: <span id="ucost-txt">50</span></small></div>
            <button class="btn" onclick="buyU()">УЛУЧШИТЬ</button>
        </div>
    </div>

    <div id="pets" class="page">
        <h2 style="color: var(--green)">ЗООПАРК</h2>
        <div id="pets-list"></div>
    </div>

    <div id="games" class="page">
        <div class="rocket-container" id="rc">
            <div id="star-field"></div>
            <div id="multiplier-txt">1.00x</div>
            <img id="rocket-obj" src="https://cdn-icons-png.flaticon.com/512/1356/1356479.png">
        </div>
        <div style="padding: 15px; background: #111; border-radius: 0 0 20px 20px;">
            <input type="number" id="bet" value="1" style="width:60px;">
            <button id="rbtn" class="btn" style="width:70%;" onclick="rocketStart()">СТАВКА</button>
        </div>
    </div>

    <div id="admin" class="page">
        <h2 style="color: var(--red)">ADMIN PANEL</h2>
        <input type="text" id="target-id" placeholder="ID игрока" style="width:85%; margin-bottom: 10px;">
        <input type="number" id="gift-amt" placeholder="Сумма MC" style="width:85%; margin-bottom: 10px;">
        <button class="btn" style="background:var(--red); width:90%" onclick="admGive()">ВЫДАТЬ ВАЛЮТУ</button>
    </div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="showP('game', this)">🍄<br>КЛИК</div>
    <div class="nav-item" onclick="showP('shop', this)">🛒<br>РЫНОК</div>
    <div class="nav-item" onclick="showP('pets', this)">🐾<br>ЗОО</div>
    <div class="nav-item" onclick="showP('games', this)">🚀<br>ИГРЫ</div>
    <div id="n-admin" class="nav-item" style="display:none; color:var(--red);" onclick="showP('admin', this)">⚙️<br>АДМИН</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDXEYGzr0W0sQijK6CkFkwcTDx93LiVEkk",
        authDomain: "mushroomclicker.firebaseapp.com",
        projectId: "mushroomclicker",
        databaseURL: "https://mushroomclicker-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tg = window.Telegram.WebApp;
    const uId = String(tg.initDataUnsafe?.user?.id || "local");
    const uName = tg.initDataUnsafe?.user?.first_name || "Gribnik";
    const MY_ID = "5100051176";

    let count = 0, mCoins = 0, power = 1, uCost = 50, myPets = {};
    const PETS_DATA = [
        { id: 'rabbit', name: 'Кролик', icon: '🐰', price: 10, inc: 300 },
        { id: 'fox', name: 'Лиса', icon: '🦊', price: 50, inc: 2000 },
        { id: 'wolf', name: 'Волк', icon: '🐺', price: 150, inc: 10000 },
        { id: 'dragon', name: 'Дракон', icon: '🐲', price: 500, inc: 50000 }
    ];

    async function init() {
        const s = await get(ref(db, 'users/' + uId));
        if(s.exists()){
            const d = s.val();
            count = d.s||0; mCoins = d.c||0; power = d.p||1; uCost = d.uc||50; myPets = d.pets||{};
        }
        if(uId === MY_ID) document.getElementById('n-admin').style.display = 'block';
        
        setInterval(activeIncome, 1000);
        createStars(); updateUI(); renderPets();
    }

    function activeIncome() {
        let total = 0;
        PETS_DATA.forEach(p => total += (myPets[p.id]||0) * p.inc);
        if(total > 0) {
            count += total;
            updateUI();
            save();
        }
    }

    window.updateUI = function() {
        document.getElementById('score').innerText = Math.floor(count).toLocaleString();
        document.getElementById('mc-val').innerText = mCoins;
        document.getElementById('ucost-txt').innerText = uCost.toLocaleString();
        document.getElementById('pwr-val').innerText = power;
        let tInc = 0; PETS_DATA.forEach(p => tInc += (myPets[p.id]||0) * p.inc);
        document.getElementById('inc-display').innerText = tInc > 0 ? `Доход: +${tInc.toLocaleString()} 🍄/сек` : "";
    }

    function save() {
        update(ref(db, 'users/' + uId), { n: uName, s: Math.floor(count), c: mCoins, p: power, uc: uCost, pets: myPets });
    }

    window.tap = () => { count += power; updateUI(); save(); tg.HapticFeedback.impactOccurred('light'); }

    // АДМИНКА (ИСПРАВЛЕНО НАЧИСЛЕНИЕ ДРУГИМ)
    window.admGive = async function() {
        const tid = document.getElementById('target-id').value.trim();
        const amt = parseInt(document.getElementById('gift-amt').value);
        if(!tid || isNaN(amt)) return tg.showAlert("Заполни все поля!");

        const userRef = ref(db, 'users/' + tid);
        const snapshot = await get(userRef);

        if(snapshot.exists()) {
            const currentData = snapshot.val();
            const newCoins = (currentData.c || 0) + amt;
            // Используем update, чтобы не удалять другие данные игрока
            await update(userRef, { c: newCoins });
            tg.showAlert(`Игроку ${tid} выдано ${amt} MC!`);
        } else {
            tg.showAlert("Игрок с таким ID не найден в базе!");
        }
    }

    // РАКЕТА
    let rRunning = false, rMult = 1.0, rInt;
    window.rocketStart = function() {
        const bet = parseInt(document.getElementById('bet').value);
        if(rRunning) { stopRocket(false); return; }
        if(mCoins < bet || bet <= 0) return tg.showAlert("Мало MC!");

        mCoins -= bet; rRunning = true; rMult = 1.0;
        document.getElementById('rbtn').innerText = "ЗАБРАТЬ!";
        document.getElementById('rocket-obj').style.display = 'block';
        updateUI();

        rInt = setInterval(() => {
            rMult += 0.06;
            document.getElementById('multiplier-txt').innerText = rMult.toFixed(2) + "x";
            let bPos = 20 + (rMult * 12);
            if(bPos < 220) document.getElementById('rocket-obj').style.bottom = bPos + "px";
            if(Math.random() < (0.01 + rMult * 0.018)) stopRocket(true);
        }, 100);
    }

    function stopRocket(c) {
        clearInterval(rInt); rRunning = false;
        const bet = parseInt(document.getElementById('bet').value);
        if(c) {
            document.getElementById('multiplier-txt').innerText = "BOOM!";
            document.getElementById('rocket-obj').style.display = 'none';
            tg.HapticFeedback.notificationOccurred('error');
        } else {
            mCoins += Math.floor(bet * rMult);
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("Выиграл " + Math.floor(bet * rMult) + " MC!");
        }
        setTimeout(() => {
            document.getElementById('rbtn').innerText = "СТАВКА";
            document.getElementById('multiplier-txt').innerText = "1.00x";
            document.getElementById('rocket-obj').style.display = 'none';
            document.getElementById('rocket-obj').style.bottom = '20px';
            updateUI(); save();
        }, 1500);
    }

    // ОБМЕН И МАГАЗИН
    window.buyMC = () => { if(count >= 500000) { count -= 500000; mCoins++; updateUI(); save(); } }
    window.sellMC = () => { if(mCoins >= 1) { mCoins--; count += 350000; updateUI(); save(); } }
    window.buyU = () => { if(count >= uCost) { count -= uCost; power++; uCost = Math.floor(uCost*1.7); updateUI(); save(); } }

    window.renderPets = () => {
        document.getElementById('pets-list').innerHTML = PETS_DATA.map(p => `
            <div class="card">
                <div>${p.icon} <b>${p.name}</b> (${myPets[p.id]||0}/2)<br><small>+${p.inc.toLocaleString()} 🍄/сек</small></div>
                <button class="btn" onclick="buyPet('${p.id}')" ${ (myPets[p.id]||0) >= 2 ? 'disabled' : '' }>${p.price} MC</button>
            </div>
        `).join('');
    }

    window.buyPet = (id) => {
        const p = PETS_DATA.find(x => x.id === id);
        if(mCoins >= p.price && (myPets[id]||0) < 2) {
            mCoins -= p.price; myPets[id] = (myPets[id]||0) + 1;
            renderPets(); updateUI(); save();
        }
    }

    window.showP = (p, el) => {
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active-page'));
        document.getElementById(p).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
    }

    function createStars() {
        const field = document.getElementById('star-field');
        for(let i=0; i<20; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + "%";
            s.style.width = s.style.height = Math.random() * 3 + "px";
            s.style.animationDuration = (Math.random() * 2 + 1) + "s";
            field.appendChild(s);
        }
    }

    init();
</script>
</body>
</html>
